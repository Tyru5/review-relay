name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Check
        run: |
          bun run check
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck scripts/relay scripts/install.sh
      # Fails unless the package.json version's tag points at this commit and has no release yet, then creates the
      # GitHub Release with the binaries attached. Retry from the tag: gh workflow run release.yml --ref v<version>
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release.ts
